[package]
name = "photoprism-mcp"
version = "0.1.0"
edition = "2021"
authors = ["PhotoPrism MCP Contributors"]
description = "MCP server for PhotoPrism photo library management"
license = "AGPL-3.0"
repository = "https://github.com/photoprism/photoprism"

[dependencies]
# MCP Framework
turbomcp = "2.2.1"
turbomcp-protocol = "2.2.1"

# Async Runtime
tokio = { version = "1.47", features = ["full"] }
async-trait = "0.1"

# HTTP Client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.0", features = ["chrono04"] }

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Config
serde_yaml = "0.9"
dirs = "5.0"

# Utilities
once_cell = "1.19"
uuid = { version = "1.6", features = ["v4", "serde"] }

[dev-dependencies]
mockito = "1.2"
tokio-test = "0.4"

[lib]
name = "photoprism_mcp"
path = "src/lib.rs"

[[bin]]
name = "photoprism-mcp"
path = "src/main.rs"
